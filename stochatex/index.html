<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StochaTeX</title>
<meta name="description" content="A free LaTeX editor that runs in your browser: compiles on your own machine, works offline, and every feature is a module you can switch on or off.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css?v=a06ed449b6">
<meta name="stx-version" content="62ef9b1fb1">
<script type="importmap">{"imports":{"./modules/autocomplete.js":"./modules/autocomplete.js?v=615a01357a","./modules/brackets.js":"./modules/brackets.js?v=fcf3ac5868","./modules/dark-mode.js":"./modules/dark-mode.js?v=fbf1483daf","./modules/dynare.js":"./modules/dynare.js?v=3ce02e80c5","./modules/equation-editor.js":"./modules/equation-editor.js?v=78bdca4756","./modules/formatting.js":"./modules/formatting.js?v=cffb51f8b7","./modules/irf-figures.js":"./modules/irf-figures.js?v=c6f8e6d11a","./modules/lib/dynare.js":"./modules/lib/dynare.js?v=192d992d57","./modules/lib/latex-math.js":"./modules/lib/latex-math.js?v=70e0b181f6","./modules/lib/latex-text.js":"./modules/lib/latex-text.js?v=f26c6e5cb3","./modules/lib/mathjax.js":"./modules/lib/mathjax.js?v=8f7e3a49fc","./modules/lib/model-state.js":"./modules/lib/model-state.js?v=2bbb0677db","./modules/lib/table-edit.js":"./modules/lib/table-edit.js?v=35585f0090","./modules/lib/viewplace.js":"./modules/lib/viewplace.js?v=7cb3c2d4a1","./modules/model-checks.js":"./modules/model-checks.js?v=bb81c12ac6","./modules/navigation.js":"./modules/navigation.js?v=ad42b8a0d0","./modules/outline.js":"./modules/outline.js?v=4923030bfc","./modules/proofread.js":"./modules/proofread.js?v=b0c01daa8a","./modules/snippets.js":"./modules/snippets.js?v=9b01f7efc8","./modules/visual-mode.js":"./modules/visual-mode.js?v=48de22cb8e","./modules/word-count.js":"./modules/word-count.js?v=d8d5dff0a0"}}</script>
</head>
<body>
<header id="top">
  <button id="projBtn" class="proj" title="StochaTeX · projects: new, open, import, export" aria-haspopup="menu"><span class="logo" aria-hidden="true"></span><span id="projName">…</span><span class="caret" aria-hidden="true"></span></button>
  <button id="folderChip" class="chip" hidden></button>
  <span class="spacer"></span>
  <div id="omni" class="omni"><nav id="crumbs" class="crumbs" aria-label="Where the cursor is"></nav><button id="omniBtn" class="omni-btn" title="Search files, sections, equations, citations and commands (Ctrl+K)"><span class="ic-slot" data-icon="search"></span><span class="lbl">Search or run…</span><kbd>Ctrl K</kbd></button></div>
  <span class="spacer"></span>
  <span id="status" class="status" role="status" aria-live="polite"></span>
  <div class="compile">
    <button id="compileBtn" class="primary"><span class="ic-slot" data-icon="play"></span>Compile</button>
    <label class="check" title="Compile again shortly after you stop typing"><input type="checkbox" id="auto"> Auto</label>
    <span class="pdf-wrap"><button id="pdfSw" class="pdf-sw on" role="switch" aria-checked="true" title="PDF beside the editor, on or off (Ctrl+Shift+H)"><span class="pdf-track"><span class="pdf-knob"></span></span><span class="lbl">PDF</span></button><button id="pdfModeBtn" class="pdf-more" title="More: open the PDF in its own tab, download it" aria-haspopup="menu" aria-label="PDF options"></button></span>
  </div>
  <span class="vr" aria-hidden="true"></span>
  <div id="topTools" class="grp"></div>
  <button id="paletteBtn" class="ghost icon-only" aria-label="All commands"><span class="ic-slot" data-icon="command"></span></button>
  <button id="featBtn" class="ghost" hidden title="Switch features on or off, and other settings"><span class="ic-slot" data-icon="sliders"></span>Features</button>
</header>
<main id="work">
  <nav id="rail" aria-label="Side panels"><div id="railPanels" class="rail-grp"></div><div id="railQuick" class="rail-grp quick" aria-label="Quick access"></div><span class="rail-fill"></span><div id="railEnd" class="rail-grp"></div></nav>
  <aside id="side" aria-label="Project">
    <div class="side-head"><span id="sideTitle">Files</span><span class="spacer"></span><span id="sideActions" class="grp"><button id="newFileBtn" class="ghost icon-only" title="New file" aria-label="New file"><span class="ic-slot" data-icon="plus"></span></button><button id="uploadBtn" class="ghost icon-only" title="Upload files (or drop them here)" aria-label="Upload files"><span class="ic-slot" data-icon="upload"></span></button></span><button id="sideHide" class="ghost icon-only" aria-label="Hide the side bar"></button></div>
    <div id="panels"><div class="panel-body tree" id="tree" data-panel="files"></div></div>
  </aside>
  <div class="split" id="split1" role="separator" aria-orientation="vertical"></div>
  <section id="edwrap" aria-label="Source">
    <div class="bar edbar"><span id="fileName" class="fname"></span><div id="toolbar" class="grp" role="toolbar" aria-label="Tools"></div><span class="spacer"></span>
      <span id="edButtons" class="grp"></span><button id="syncBtn" class="ghost icon-only" aria-label="Show this line in the PDF"><span class="ic-slot" data-icon="locate"></span></button></div>
    <div id="ed"></div>
    <div id="binview" hidden></div>
    <div id="dock" hidden><div id="dockGrip" role="separator" aria-orientation="horizontal" title="Drag to resize"></div><div class="bar dockbar"><span id="dockTitle" class="dock-title"></span><span id="dockInfo" class="muted"></span><span class="spacer"></span><span id="dockActions" class="grp"></span><button id="dockClose" class="ghost icon-only" title="Close" aria-label="Close"><span class="ic-slot" data-icon="close"></span></button></div><div id="dockBody"></div></div>
    <div id="bottom">
      <div class="bar statusbar"><button id="tabProblems" class="tab">Problems</button><button id="tabLog" class="tab">Log</button><span class="spacer"></span><span id="statusItems"></span><span id="cursorInfo" class="status-item"></span></div>
      <div id="bottomBody" hidden><div id="problemList" hidden></div><pre id="logText" hidden></pre></div>
    </div>
  </section>
  <div class="split" id="split2" role="separator" aria-orientation="vertical"></div>
  <section id="pdfwrap" aria-label="PDF preview">
    <div class="bar"><button id="zoomOut" class="ghost icon-only" title="Zoom out" aria-label="Zoom out">−</button><span id="zoomInfo" class="muted num">100%</span><button id="zoomIn" class="ghost icon-only" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="zoomFit" class="ghost" title="Fit the page width">Fit</button><span class="spacer"></span><span id="pageInfo" class="muted num"></span><button id="pdfDownload" class="ghost" title="Download the PDF">Download</button><button id="pdfTabBtn" class="ghost icon-only" title="Open the PDF in its own browser tab (handy on a second screen)" aria-label="Open the PDF in its own tab"><span class="ic-slot" data-icon="external"></span></button><button id="pdfHideBtn" class="ghost icon-only" title="Hide the PDF (the PDF switch beside Visual shows it again)" aria-label="Hide the PDF"><span class="ic-slot" data-icon="close"></span></button></div>
    <div id="pdf"><div id="pdfEmpty" class="pad">The PDF appears here after the first compile. The first run downloads the TeX engine (about 35 MB) and keeps it for next time.</div></div>
  </section>
</main>
<noscript>This editor needs JavaScript.</noscript>
<script type="module" src="core.js?v=006432d5d2"></script>
</body>
</html>
